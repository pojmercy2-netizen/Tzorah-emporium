[build]
  command = "npm run build"
  publish = ".output/public"

[functions]
  # Nitro serverless output directory
  directory = ".output/server"
  node_bundler = "esbuild"

[[redirects]]
  # Route all requests through the Nitro server handler
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
